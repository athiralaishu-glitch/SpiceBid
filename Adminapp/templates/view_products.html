<!DOCTYPE html>
{% extends 'dashboard.html' %}
{% block content %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="card">
                  <div class="card-body">
                    <h4 class="card-title">Product Registration Form</h4>
<!--                    <p class="card-description"> Horizontal form layout </p>-->
                    <form class="forms-sample" method="post" action="#" enctype="multipart/form-data">
                        {% csrf_token %}
                      <div class="form-group row">
                        <label for="exampleInputUsername2" class="col-sm-3 col-form-label">Product Name</label>
                        <div class="col-sm-9">
                          <input type="text" class="form-control" id="exampleInputUsername2" name="pname" placeholder="product_name*">
                        </div>
                      </div>
                      <div class="form-group row">
                        <label  class="col-sm-3 col-form-label">Description</label>
                        <div class="col-sm-9">
                          <input type="text" class="form-control" id="exampleInputEmail1" name="desc" placeholder="descripion*">
                        </div>
                      </div>


                        <div class="form-group row">
                        <label  class="col-sm-3 col-form-label">Price</label>
                        <div class="col-sm-9">
                          <input type="text" class="form-control" id="exampleInputEmail4" name="price" placeholder="price*">
                        </div>
                      </div>
<!--                        <div class="form-group row">-->
<!--                        <label  class="col-sm-3 col-form-label">Quantity</label>-->
<!--                        <div class="col-sm-9">-->
<!--                          <input type="number" class="form-control" id="exampleInputEmail25" placeholder="quantity*">-->
<!--                        </div>-->
<!--                      </div>-->
                        

                         <div class="form-group row">
                        <label  class="col-sm-3 col-form-label">Product Image</label>
                        <div class="col-sm-9">
                          <input type="file" class="form-control" id="exampleInputEmail3" name="pimg" placeholder="image*">
                        </div>
                      </div>

                      <div class="form-check form-check-flat form-check-primary">
                        <label class="form-check-label">
                          <input type="checkbox" class="form-check-input"> Remember me <i class="input-helper"></i></label>
                      </div>
                      <button type="submit" class="btn btn-primary mr-2">Submit</button>
                      <button class="btn btn-dark">Cancel</button>
                    </form>
                  </div>
                </div>




</body>


<style>
/* Center the card */
.card {
    max-width: 700px;
    margin: 40px auto;          /* centers horizontally */
    border: 1px solid #e0e0e0;  /* clean border */
    border-radius: 10px;
    box-shadow: 0 6px 18px grey;
    background-color: #ffffff;
}

/* Card body spacing */
.card-body {
    padding: 30px;
}

/* Title styling */
.card-title {
    text-align: center;
    font-weight: 600;
    margin-bottom: 25px;
    color: #333;
}

/* Label styling */
.form-group label {
    font-weight: 500;
    color: #444;
}

/* Input & file fields */
.form-control {
    height: 45px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* Focus effect */
.form-control:focus {
    border-color: #4B49AC;
    box-shadow: 0 0 0 0.1rem rgba(75, 73, 172, 0.25);
}

/* Checkbox alignment */
.form-check {
    margin: 20px 0;
}

/* Buttons alignment */
button[type="submit"],
.btn-dark {
    min-width: 120px;
}

/* Button spacing */
.btn {
    margin-right: 10px;
}

</style>

</html>
{% endblock %}
