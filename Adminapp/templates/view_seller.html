
{% extends 'dashboard.html' %}
{% load static %}


{% block content %}




          <div class="row">
           
            <div class="col-lg-12 stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Seller Table</h4>
                 
                 <div class="table-responsive pt-3">
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>#</th>
        <th>Seller Name</th>
        <th>Email</th>
        <th>Address</th>
        <th>Mobile</th>
        <th>Status</th>
        <th>Details</th>
      </tr>
    </thead>
    <tbody>
            {% for s in seller %}

      <tr class="table-info">
        <td>{{s.id}}</td>
        <td>{{s.seller_name}}</td>
        <td>{{s.user.email}}</td>
        <td>{{s.address}}</td>
        <td>{{s.phone_number}}</td>
        <td>{{s.kyc_status}}</td>
        <td>

 <a href="{% url 'seller_viewmore' s_id=s.id %}" class="btn btn-sm btn-primary">
    View
</a>
         </td>
      </tr>
            {% endfor %}


    </tbody>
  </table>
</div>
                </div>
              </div>
            </div>
          </div>





{% endblock %}
