{% extends 'dashboard.html' %}
{% load static %}

{% block content %}

<div class="row">
  <div class="col-lg-12 stretch-card">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Buyer's Table</h4>

        <div class="table-responsive pt-3">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>#</th>
                <th>Buyer Name</th>
                <th>Email</th>
                <th>Address</th>
                <th>Mobile</th>

              </tr>
            </thead>

            <tbody>
              {% for s in buyer %}
              <tr class="table-info">
                <td>{{s.id}}</td>
                <td>{{s.buyer_name}}</td>
                <td>{{s.user.email}}</td>
                <td>{{s.address}}</td>
                <td>{{s.phone_number}}</td>

              </tr>
              {% endfor %}
            </tbody>

          </table>
        </div>

      </div>
    </div>
  </div>
</div>

{% endblock %}
